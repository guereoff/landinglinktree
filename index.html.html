<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caricamento...</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .enter-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.65);
            cursor: pointer;
            transition: opacity 0.4s ease;
        }
        .enter-btn {
            background: #0b132b;          /* Blu opaco notte */
            color: #ffffff;               /* Scritta bianca */
            border: 2px solid #ffffff;    /* Contorno bianco */
            padding: 16px 36px;
            border-radius: 40px;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s ease, background 0.2s ease;
        }
        .enter-btn:hover {
            background: #1c2541;          
        }
        .enter-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <!-- Sostituisci 'video.mp4' con il nome esatto del tuo file video -->
    <video id="introVideo" playsinline>
        <source src="video.mp4" type="video/mp4">
        Il tuo browser non supporta il tag video.
    </video>

    <div class="enter-overlay" id="enterOverlay">
        <button class="enter-btn">ENTRA</button>
    </div>

    <script>
        const video = document.getElementById('introVideo');
        const overlay = document.getElementById('enterOverlay');
        
        // ---> INSERISCI QUI IL TUO LINKTREE <---
        const linktreeUrl = 'https://linktr.ee/guereo.official'; 

        // Quando l'utente preme il tasto "Entra", sblocchiamo audio e facciamo partire il video
        overlay.addEventListener('click', () => {
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 400);
            
            video.muted = false; // Attiva l'audio
            video.play();        // Fa partire il video
        });

        // Appena il video finisce, reindirizza automaticamente al Linktree
        video.onended = function() {
            window.location.href = linktreeUrl;
        };

        // Di sicurezza: se ci sono problemi col video, dopo 15 secondi va comunque al Linktree
        setTimeout(() => {
            if (video.paused && overlay.style.display !== 'none') {
                // Lasciamo che l'utente decida di cliccare
            }
        }, 15000);
    </script>

</body>
</html>
